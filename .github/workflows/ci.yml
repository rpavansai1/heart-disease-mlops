# ============================================================
# AIMLCZG523 - Machine Learning Operations
# Assignment 1 - GitHub Actions CI/CD Pipeline
# Steps: Linting → Unit Tests → Model Training → Artifacts
# ============================================================

name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ============================================================
  # JOB 1: LINTING
  # ============================================================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 linting
        run: |
          echo "Running flake8 linting..."
          flake8 src/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --ignore=E501,W503,E402,E226,E127,E128,E302,F401,F841,F541 \
            --count \
            --statistics
          echo "Linting passed!"

  # ============================================================
  # JOB 2: UNIT TESTS
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          echo "Downloading Heart Disease dataset..."
          python data/download_data.py

      - name: Run EDA and preprocessing
        run: |
          echo "Running EDA..."
          python notebooks/eda.py

      - name: Train models
        run: |
          echo "Training models..."
          python src/train.py

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          pytest tests/ -v \
            --tb=short \
            --junitxml=test-results/results.xml \
            --log-cli-level=INFO

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ============================================================
  # JOB 3: MODEL TRAINING & ARTIFACTS
  # ============================================================
  train:
    name: Model Training
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: python data/download_data.py

      - name: Run EDA
        run: python notebooks/eda.py

      - name: Train models with MLflow tracking
        run: |
          echo "Training models with MLflow tracking..."
          python src/train.py

      - name: Verify model artifacts
        run: |
          echo "Verifying model artifacts..."
          ls -la models/
          python -c "
          import pickle
          import os

          models = [
              'models/best_model.pkl',
              'models/logistic_regression.pkl',
              'models/random_forest.pkl',
              'models/scaler.pkl',
              'models/preprocessing_pipeline.pkl'
          ]

          for model_path in models:
              assert os.path.exists(model_path), f'Missing: {model_path}'
              with open(model_path, 'rb') as f:
                  obj = pickle.load(f)
              assert obj is not None, f'Failed to load: {model_path}'
              print(f'Verified: {model_path}')

          print('All model artifacts verified!')
          "

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/
            screenshots/
            mlflow.db
          retention-days: 7

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlflow.db
          retention-days: 7

      - name: Log pipeline summary
        run: |
          echo "============================================"
          echo "MLOps CI/CD Pipeline Summary"
          echo "============================================"
          echo "Linting: PASSED"
          echo "Unit Tests: PASSED"
          echo "Model Training: PASSED"
          echo "Artifacts: SAVED"
          echo "============================================"
          python -c "
          import pickle
          import os
          from sklearn.metrics import accuracy_score
          import pandas as pd

          # Load model and pipeline
          with open('models/best_model.pkl', 'rb') as f:
              model = pickle.load(f)
          with open('models/preprocessing_pipeline.pkl', 'rb') as f:
              pipeline = pickle.load(f)

          # Load data
          df = pd.read_csv('data/heart_cleaned.csv')
          X = df.drop('target', axis=1)
          y = df['target']

          # Preprocess
          scaler = pipeline['scaler']
          feature_names = pipeline['feature_names']
          categorical_cols = pipeline['categorical_cols']
          numeric_present = pipeline['numeric_present']

          import pandas as pd
          X_encoded = pd.get_dummies(X, columns=categorical_cols, drop_first=True)
          X_aligned = X_encoded.reindex(columns=feature_names, fill_value=0)
          X_aligned[numeric_present] = scaler.transform(X_aligned[numeric_present])

          # Evaluate
          predictions = model.predict(X_aligned.values)
          accuracy = accuracy_score(y, predictions)
          print(f'Final Model Accuracy: {accuracy:.4f}')
          print(f'Model Type: {type(model).__name__}')
          "
