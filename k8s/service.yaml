# Assignment 1 - Kubernetes Service Manifest
# Exposes the API via LoadBalancer
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    nodePort: 30080
